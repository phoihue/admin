<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BỆNH VIỆN PHỔI THÀNH PHỐ HUẾ - QUẢN LÝ PHẦN MỀM DÙNG CHUNG</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f2f6fa;
            color: #17324d;
        }

        /* ===== PHẦN ĐẦU TRANG ===== */
        .header {
            background: #064b78;
            color: white;
            text-align: center;
            padding: 28px 15px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.15);
        }

        .header h1 {
            margin: 0;
            font-size: 25px;
            font-weight: 700;
        }

        .header p {
            margin: 8px 0 0;
            font-size: 15px;
            opacity: 0.9;
        }

        /* ===== NỘI DUNG ===== */
        .container {
            max-width: 900px;
            margin: 35px auto;
            padding: 0 20px;
        }

        .title {
            text-align: center;
            margin-bottom: 25px;
        }

        .title h2 {
            margin: 0;
            color: #064b78;
            font-size: 22px;
        }

        /* ===== DANH SÁCH NÚT ===== */
        #appList {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .app-button {
            display: flex;
            align-items: center;
            justify-content: center;

            width: 100%;
            min-height: 70px;

            padding: 15px 25px;

            background: #064b78;
            color: white;

            border: none;
            border-radius: 8px;

            font-size: 19px;
            font-weight: 600;

            cursor: pointer;
            text-decoration: none;

            box-shadow: 0 3px 6px rgba(0,0,0,0.15);

            transition: all 0.2s ease;
        }

        .app-button:hover {
            background: #08649e;
            transform: translateY(-2px);
            box-shadow: 0 5px 10px rgba(0,0,0,0.20);
        }

        .app-button:active {
            transform: translateY(0);
        }

        /* ===== CHÂN TRANG ===== */
        .footer {
            text-align: center;
            color: #687b8c;
            font-size: 13px;
            margin: 45px 15px 20px;
        }

        /* ===== ĐIỆN THOẠI ===== */
        @media (max-width: 600px) {

            .header {
                padding: 22px 12px;
            }

            .header h1 {
                font-size: 19px;
                line-height: 1.4;
            }

            .header p {
                font-size: 13px;
            }

            .container {
                margin-top: 25px;
                padding: 0 15px;
            }

            .title h2 {
                font-size: 18px;
            }

            .app-button {
                min-height: 65px;
                font-size: 17px;
                padding: 12px 15px;
            }
        }
    </style>
</head>


<body>

    <!-- ================================
         PHẦN TIÊU ĐỀ
    ================================= -->
    <header class="header">

        <h1>
            BỆNH VIỆN PHỔI THÀNH PHỐ HUẾ
        </h1>

        <p>
            QUẢN LÝ PHẦN MỀM DÙNG CHUNG
        </p>

    </header>


    <!-- ================================
         PHẦN NỘI DUNG
    ================================= -->
    <main class="container">

        <div class="title">
            <h2>HỆ THỐNG PHẦN MỀM</h2>
        </div>

        <!--
            Các nút phần mềm sẽ được tự động tạo tại đây
        -->
        <div id="appList"></div>

    </main>


    <!-- ================================
         CHÂN TRANG
    ================================= -->
    <footer class="footer">

        Bệnh viện Phổi thành phố Huế<br>
        Hệ thống phần mềm dùng chung

    </footer>



    <script>

        /* =====================================================
           DANH SÁCH PHẦN MỀM
           
           CHỈ CẦN SỬA PHẦN NÀY
           
           "name" = TÊN HIỂN THỊ TRÊN NÚT
           "url"  = LINK ĐẾN PHẦN MỀM
           ===================================================== */

        const applications = [

            {
                name: "QUẢN LÝ SÀNG LỌC BỆNH LAO",
                url: "https://example.com/app1"
            },

            {
                name: "QUẢN LÝ BỆNH NHÂN LAO",
                url: "https://example.com/app2"
            },

            {
                name: "QUẢN LÝ SÀNG LỌC BỆNH PHỔI",
                url: "https://example.com/app3"
            },

            {
                name: "QUẢN LÝ ĐO CHỨC NĂNG HÔ HẤP",
                url: "https://example.com/app4"
            },

            {
                name: "BÁO CÁO HOẠT ĐỘNG CHUYÊN MÔN",
                url: "https://example.com/app5"
            }

        ];


        /* =====================================================
           KHÔNG CẦN SỬA PHẦN BÊN DƯỚI
           ===================================================== */

        const appList = document.getElementById("appList");


        applications.forEach(function(app) {

            const button = document.createElement("a");

            button.className = "app-button";

            button.textContent = app.name;

            button.href = app.url;

            /*
                Mở phần mềm trong tab mới.
                Nếu muốn mở ngay trong tab hiện tại,
                có thể xóa dòng này.
            */
            button.target = "_blank";

            button.rel = "noopener noreferrer";

            appList.appendChild(button);

        });

    </script>

</body>
</html>
